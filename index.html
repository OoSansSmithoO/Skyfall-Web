<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ==========================================
         PRIMARY SEO
         ========================================== -->

    <title>
      Skyfall | Autonomous Spacecraft, Orbital Robotics & Space Systems
    </title>

    <meta
      name="description"
      content="Skyfall develops autonomous spacecraft, orbital robotics, proximity operations, capture systems, sensing, mission software, and advanced space systems for commercial, civil, research, and national security missions."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="theme-color"
      content="#030609"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <!-- ==========================================
         CANONICAL URL
         Temporary GitHub Pages URL.
         Replace when the production domain is live.
         ========================================== -->

    <link
      rel="canonical"
      href="https://oosanssmithoo.github.io/Skyfall-Web/"
    />

    <!-- ==========================================
         FAVICON / DEVICE ICON
         ========================================== -->

    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%brand/manifestation.png"
    />

    <link
      rel="apple-touch-icon"
      href="%BASE_URL%brand/manifestation.png"
    />

    <!-- ==========================================
         OPEN GRAPH
         ========================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Skyfall"
    />

    <meta
      property="og:title"
      content="Skyfall | Autonomous Spacecraft & Orbital Systems"
    />

    <meta
      property="og:description"
      content="Autonomous spacecraft and orbital systems for sensing, rendezvous, proximity operations, capture, control, transfer, and servicing."
    />

    <meta
      property="og:url"
      content="https://oosanssmithoo.github.io/Skyfall-Web/"
    />

    <meta
      property="og:image"
      content="https://oosanssmithoo.github.io/Skyfall-Web/brand/social.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:type"
      content="image/jpeg"
    />

    <meta
      property="og:image:alt"
      content="Skyfall N Series CLEANS autonomous orbital spacecraft system"
    />

    <!-- ==========================================
         X / TWITTER CARD
         ========================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Skyfall | Autonomous Spacecraft & Orbital Systems"
    />

    <meta
      name="twitter:description"
      content="Autonomous spacecraft and orbital systems for sensing, rendezvous, capture, control, transfer, and servicing."
    />

    <meta
      name="twitter:image"
      content="https://oosanssmithoo.github.io/Skyfall-Web/brand/social.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Skyfall N Series CLEANS autonomous orbital spacecraft system"
    />

    <!-- ==========================================
         STRUCTURED DATA
         ========================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Skyfall",
        "url": "https://oosanssmithoo.github.io/Skyfall-Web/",
        "logo": "https://oosanssmithoo.github.io/Skyfall-Web/brand/manifestation.png",
        "description": "Skyfall develops autonomous spacecraft, orbital robotics, proximity operations, capture systems, sensing, mission software, and advanced space systems."
      }
    </script>

    <!-- ==========================================
         APPLICATION
         ========================================== -->

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
